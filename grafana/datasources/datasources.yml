# Grafana Datasources Configuration
# This file is automatically provisioned when Grafana starts

apiVersion: 1

datasources:
  # Prometheus datasource for metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      queryTimeout: 60s
      # Enable exemplars for linking metrics to traces
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
    version: 1

  # Jaeger datasource for distributed tracing
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    uid: jaeger
    editable: true
    jsonData:
      tracesToLogs:
        # Link traces to logs in Loki
        datasourceUid: "loki"
        tags: ["job", "container", "service"]
        mappedTags: [{ key: "service.name", value: "service" }]
        mapTagNamesEnabled: false
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false
        # Custom query to find logs by trace_id
        customQuery: true
        query: '{job="$${__tags}"} |~ "trace_id.?:?.?$${__span.traceId}"'
      tracesToMetrics:
        # Link traces to metrics
        datasourceUid: "prometheus"
        tags: [{ key: "service.name", value: "service" }]
        queries:
          - name: "Sample query"
            query: "sum(rate(traces_spanmetrics_latency_bucket{$__tags}[5m]))"
      nodeGraph:
        enabled: true
    version: 1

  # Loki datasource for logs
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    editable: true
    jsonData:
      maxLines: 1000
      # Derived fields for trace-to-log correlation
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: '"trace_id":"?([0-9a-fA-F]+)"?'
          name: TraceID
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace"
        - datasourceUid: jaeger
          matcherRegex: "trace_id=([0-9a-fA-F]+)"
          name: TraceID
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace"
    version: 1
