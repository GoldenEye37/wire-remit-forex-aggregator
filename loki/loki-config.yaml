# Loki Configuration for WireRemit Forex Aggregator
# Version: 3.x with native OTLP support

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

distributor:
  ring:
    kvstore:
      store: inmemory

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  max_chunk_age: 1h
  chunk_target_size: 1048576
  chunk_encoding: snappy
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: true

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
      row_shards: 16

compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

limits_config:
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_line_size: 262144
  max_line_size_truncate: false
  max_streams_per_user: 10000
  max_global_streams_per_user: 50000
  max_entries_limit_per_query: 5000
  max_query_length: 721h
  max_query_parallelism: 32
  max_query_series: 500
  max_label_names_per_series: 30
  max_label_name_length: 1024
  max_label_value_length: 2048
  allow_structured_metadata: true
  max_structured_metadata_size: 65536
  max_structured_metadata_entries_count: 128
  retention_period: 744h
  cardinality_limit: 100000
  max_streams_matchers_per_query: 1000
  split_queries_by_interval: 15m
  max_cache_freshness_per_query: 10m
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  creation_grace_period: 10m
  per_stream_rate_limit: 3145728
  per_stream_rate_limit_burst: 15728640
  unordered_writes: true
  max_query_lookback: 744h

query_range:
  align_queries_with_step: true
  max_retries: 5
  parallelise_shardable_queries: true
  cache_results: true

query_frontend:
  max_outstanding_per_tenant: 256
  compress_responses: true
  log_queries_longer_than: 5s

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  enable_api: true

table_manager:
  retention_deletes_enabled: true
  retention_period: 744h

analytics:
  reporting_enabled: false

tracing:
  enabled: false

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

memberlist:
  node_name: loki
  bind_addr:
    - 0.0.0.0
  bind_port: 7946
